<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>宝贝课程管家</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f8f3ef;--card:#fffdfa;--ink:#514944;--muted:#938780;--pink:#d9a9a2;--pink2:#f2dfdc;--sage:#dce8df;--line:#eee5df;--gold:#eadcbf;--shadow:0 6px 22px #70594b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding-bottom:90px}
header{padding:22px 18px 16px;background:linear-gradient(135deg,#f4e5e0,#f8f3ef)}header small{color:var(--muted);letter-spacing:2px}h1{font-size:24px;margin:7px 0 4px}header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:760px;margin:auto;padding:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat,.panel,.course{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:23px;margin-top:5px;color:#76645c}.stat span{font-size:11px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfaf2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:4}
nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px;min-width:54px}nav button strong{display:block;font-size:20px;font-weight:500;margin-bottom:2px}nav button.active{color:#b77e77}
.view{display:none}.view.active{display:block}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 12px}.sectionhead h2{font-size:17px;margin:0}
button,.btn{cursor:pointer}.primary{border:0;border-radius:12px;background:#b98078;color:white;padding:11px 15px;font-size:14px}.soft{border:1px solid var(--line);border-radius:10px;background:#fffaf7;color:var(--ink);padding:8px 11px;font-size:13px}.danger{color:#a45d58}
.course{margin-bottom:10px}.courseTop{display:flex;justify-content:space-between;gap:10px}.course h3{margin:0 0 6px;font-size:16px}.meta{font-size:12px;color:var(--muted);line-height:1.8}.pill{display:inline-block;background:var(--pink2);color:#936c66;border-radius:20px;padding:4px 8px;font-size:11px;margin:2px}.pill.green{background:var(--sage);color:#607b68}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fffdfa;color:var(--ink);font:inherit;font-size:14px}textarea{min-height:65px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:32px 12px}.empty div{font-size:32px;margin-bottom:8px}
.item{padding:12px 2px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:4px;line-height:1.6}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.monthbar b{font-size:16px}.day{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:8px}.dayhead{font-size:13px;font-weight:600;margin-bottom:7px}.dayevent{font-size:12px;padding:7px 8px;border-radius:9px;background:#f7eeeb;margin:4px 0;display:flex;justify-content:space-between;gap:8px}.dayevent.done{background:#e7efe8}.dayevent.leave{background:#f6edda}
.modal{position:fixed;inset:0;background:#35292366;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(25px + env(safe-area-inset-bottom));width:100%;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 8px;font-size:18px}.sheetfoot{display:flex;gap:9px;margin-top:16px}.sheetfoot button{flex:1}
.notice{font-size:12px;color:var(--muted);line-height:1.7;background:#f3e9e4;border-radius:12px;padding:11px;margin:10px 0}
@media(min-width:600px){main{padding:22px}.sheet{max-width:600px;margin:auto;border-radius:22px}.modal{align-items:center;padding:20px}.stats{gap:14px}}
</style>
</head>
<body>
<header><small>MY LITTLE COURSE PLANNER</small><h1>宝贝课程管家 ♡</h1><p>把每一堂成长时光，都好好记录下来</p></header>
<main>
<div class="stats"><div class="stat"><span>正在上的课程</span><b id="sCourses">0</b></div><div class="stat"><span>剩余课时</span><b id="sLessons">0</b></div><div class="stat"><span>待缴费用</span><b id="sDue">0</b></div></div>
<section id="home" class="view active"><div class="sectionhead"><h2>我的课程</h2><button class="primary" onclick="openCourse()">＋ 添加课程</button></div><div id="courseList"></div></section>
<section id="calendar" class="view"><div class="sectionhead"><h2>每月课表</h2><button class="primary" onclick="addLesson()">＋ 记一堂课</button></div><div class="monthbar"><button class="soft" onclick="shiftMonth(-1)">‹ 上月</button><b id="monthLabel"></b><button class="soft" onclick="shiftMonth(1)">下月 ›</button></div><div id="calendarList"></div></section>
<section id="records" class="view"><div class="sectionhead"><h2>上课记录</h2><button class="primary" onclick="addLesson()">＋ 添加记录</button></div><div id="recordList"></div></section>
<section id="money" class="view"><div class="sectionhead"><h2>缴费记录</h2><button class="primary" onclick="addPayment()">＋ 记一笔</button></div><div id="moneySummary" class="panel"></div><div id="paymentList" class="panel" style="margin-top:10px"></div></section>
<section id="report" class="view"><div class="sectionhead"><h2>月度报告</h2></div><div class="panel"><label>选择月份</label><input id="reportMonth" type="month" onchange="renderReport()"><div id="reportContent"></div></div><div class="sectionhead" style="margin-top:18px"><h2>数据备份</h2></div><div class="panel"><p class="meta">定期导出备份，换手机或误删数据时可以恢复。</p><div class="actions"><button class="primary" onclick="backup()">导出备份</button><button class="soft" onclick="document.getElementById('restoreFile').click()">导入恢复</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restore(event)"></div></div></section>
</main>
<nav><button class="active" data-tab="home" onclick="tab('home',this)"><strong>⌂</strong>课程</button><button data-tab="calendar" onclick="tab('calendar',this)"><strong>▦</strong>月课表</button><button data-tab="records" onclick="tab('records',this)"><strong>✓</strong>上课记录</button><button data-tab="money" onclick="tab('money',this)"><strong>￥</strong>缴费</button><button data-tab="report" onclick="tab('report',this)"><strong>▤</strong>报告</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="sheetfoot"><button class="soft" onclick="closeModal()">取消</button><button class="primary" id="modalSave">保存</button></div></div></div>
<script>
const KEY='babyCourseManagerV1';let data=load(),month=new Date();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{courses:[],lessons:[],payments:[]}}catch(e){return{courses:[],lessons:[],payments:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function courseName(id){return data.courses.find(c=>c.id===id)?.name||'已删除课程'}
function completed(id){return data.lessons.filter(x=>x.courseId===id&&x.status==='已完成').length}
function paid(id){return data.payments.filter(x=>x.courseId===id).reduce((s,x)=>s+Number(x.amount||0),0)}
function tab(id,el){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));(el||document.querySelector(`[data-tab="${id}"]`)).classList.add('active');render()}
function openModal(title,body,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').onclick=fn;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openCourse(id){let c=data.courses.find(x=>x.id===id)||{};openModal(id?'编辑课程':'添加课程',`
<div class="formgrid">
<div class="full"><label>课程名称 *</label><input id="fName" value="${esc(c.name||'')}" placeholder="例如：英语、钢琴、游泳"></div>
<div><label>每周上课日</label><select id="fDay">${['周一','周二','周三','周四','周五','周六','周日','不固定'].map(x=>`<option ${c.day===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div><label>上课时间</label><input id="fTime" type="time" value="${c.time||'16:00'}"></div>
<div><label>时长（分钟）</label><input id="fDuration" type="number" min="1" value="${c.duration||60}"></div>
<div><label>报名总课时</label><input id="fTotal" type="number" min="0" value="${c.total??0}"></div>
<div><label>报名费用（元）</label><input id="fFee" type="number" min="0" step="0.01" value="${c.fee??0}"></div>
<div><label>开课日期</label><input id="fStart" type="date" value="${c.start||''}"></div>
<div><label>结束日期</label><input id="fEnd" type="date" value="${c.end||''}"></div>
<div class="full"><label>上课地址</label><input id="fAddress" value="${esc(c.address||'')}" placeholder="培训机构/详细地址"></div>
<div class="full"><label>楼层 / 教室</label><input id="fRoom" value="${esc(c.room||'')}" placeholder="例如：3楼 302室"></div>
<div class="full"><label>备注</label><textarea id="fNote">${esc(c.note||'')}</textarea></div></div>`,()=>{let name=document.getElementById('fName').value.trim();if(!name){alert('请填写课程名称');return}let obj={id:c.id||crypto.randomUUID(),name,day:document.getElementById('fDay').value,time:document.getElementById('fTime').value,duration:+document.getElementById('fDuration').value,total:+document.getElementById('fTotal').value,fee:+document.getElementById('fFee').value,start:document.getElementById('fStart').value,end:document.getElementById('fEnd').value,address:document.getElementById('fAddress').value,room:document.getElementById('fRoom').value,note:document.getElementById('fNote').value};if(id)data.courses=data.courses.map(x=>x.id===id?obj:x);else data.courses.push(obj);closeModal();save()})}
function addLesson(lesson){let x=lesson||{};let opts=data.courses.map(c=>`<option value="${c.id}" ${x.courseId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');if(!opts){alert('请先添加课程资料');tab('home');return}openModal('上课记录',`<label>课程</label><select id="lCourse">${opts}</select><label>上课日期</label><input id="lDate" type="date" value="${x.date||new Date().toISOString().slice(0,10)}"><label>状态</label><select id="lStatus">${['待上课','已完成','请假','缺课','补课'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><label>请假 / 缺课原因</label><input id="lReason" value="${esc(x.reason||'')}"><label>补课日期（如有）</label><input id="lMakeup" type="date" value="${x.makeup||''}"><label>备注</label><textarea id="lNote">${esc(x.note||'')}</textarea>`,()=>{let obj={id:x.id||crypto.randomUUID(),courseId:document.getElementById('lCourse').value,date:document.getElementById('lDate').value,status:document.getElementById('lStatus').value,reason:document.getElementById('lReason').value,makeup:document.getElementById('lMakeup').value,note:document.getElementById('lNote').value};if(x.id)data.lessons=data.lessons.map(a=>a.id===x.id?obj:a);else data.lessons.push(obj);closeModal();save()})}
function addPayment(p){let x=p||{};let opts=data.courses.map(c=>`<option value="${c.id}" ${x.courseId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');if(!opts){alert('请先添加课程资料');tab('home');return}openModal('缴费记录',`<label>课程</label><select id="pCourse">${opts}</select><label>缴费日期</label><input id="pDate" type="date" value="${x.date||new Date().toISOString().slice(0,10)}"><label>缴费金额（元）</label><input id="pAmount" type="number" min="0" step="0.01" value="${x.amount||''}"><label>缴费方式</label><input id="pMethod" value="${esc(x.method||'')}" placeholder="现金 / 微信 / 支付宝等"><label>备注</label><textarea id="pNote">${esc(x.note||'')}</textarea>`,()=>{let obj={id:x.id||crypto.randomUUID(),courseId:document.getElementById('pCourse').value,date:document.getElementById('pDate').value,amount:+document.getElementById('pAmount').value,method:document.getElementById('pMethod').value,note:document.getElementById('pNote').value};data.payments.push(obj);closeModal();save()})}
function del(type,id){if(!confirm('确定删除这条记录吗？'))return;data[type]=data[type].filter(x=>x.id!==id);save()}
function render(){let active=data.courses.length,remain=data.courses.reduce((s,c)=>s+Math.max(0,c.total-completed(c.id)),0),due=data.courses.reduce((s,c)=>s+Math.max(0,c.fee-paid(c.id)),0);sCourses.textContent=active;sLessons.textContent=remain;sDue.textContent=money(due);
courseList.innerHTML=data.courses.length?data.courses.map(c=>`<div class="course"><div class="courseTop"><div><h3>♡ ${esc(c.name)}</h3><div class="meta">${esc(c.day||'')} ${esc(c.time||'')} · ${c.duration||60}分钟</div></div><span class="pill green">剩余 ${Math.max(0,c.total-completed(c.id))} 节</span></div><div class="meta">📍 ${esc(c.address||'未填写地址')} ${esc(c.room||'')}<br>报名 ${c.total||0} 节 · 已完成 ${completed(c.id)} 节<br>费用 ${money(c.fee)} · 已缴 ${money(paid(c.id))} · 待缴 ${money(Math.max(0,c.fee-paid(c.id)))}</div><div class="actions"><button class="soft" onclick="addLesson({courseId:'${c.id}'})">＋ 上课记录</button><button class="soft" onclick="openCourse('${c.id}')">编辑</button><button class="soft danger" onclick="del('courses','${c.id}')">删除</button></div></div>`).join(''):'<div class="empty"><div>🌷</div>还没有课程，点击右上角添加第一门课程吧</div>';
renderCalendar();renderRecords();renderMoney();renderReport()}
function renderCalendar(){monthLabel.textContent=month.getFullYear()+'年'+(month.getMonth()+1)+'月';let y=month.getFullYear(),m=month.getMonth(),arr=data.lessons.filter(x=>{let d=new Date(x.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>a.date.localeCompare(b.date));calendarList.innerHTML=arr.length?arr.map(x=>`<div class="day"><div class="dayhead">${x.date} · ${new Date(x.date+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'long'})}</div><div class="dayevent ${x.status==='已完成'?'done':x.status==='请假'?'leave':''}"><span>${esc(courseName(x.courseId))} · ${esc(x.status)}</span><button class="soft" onclick="addLesson(data.lessons.find(a=>a.id==='${x.id}'))">修改</button></div></div>`).join(''):'<div class="empty">这个月还没有上课记录。点击“记一堂课”添加课程。</div>'}
function shiftMonth(n){month.setMonth(month.getMonth()+n);renderCalendar()}
function renderRecords(){let arr=[...data.lessons].sort((a,b)=>b.date.localeCompare(a.date));recordList.innerHTML=arr.length?arr.map(x=>`<div class="item"><b>${esc(courseName(x.courseId))} · ${esc(x.status)}</b><small>${x.date} ${x.reason?'· '+esc(x.reason):''} ${x.makeup?'· 补课：'+x.makeup:''}</small><div class="actions"><button class="soft" onclick="addLesson(data.lessons.find(a=>a.id==='${x.id}'))">编辑</button><button class="soft danger" onclick="del('lessons','${x.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有上课记录</div>'}
function renderMoney(){moneySummary.innerHTML=`<b>费用概览</b><p class="meta">报名总费用：${money(data.courses.reduce((s,c)=>s+c.fee,0))}<br>累计已缴：${money(data.payments.reduce((s,p)=>s+p.amount,0))}<br>剩余待缴：${money(data.courses.reduce((s,c)=>s+Math.max(0,c.fee-paid(c.id)),0))}</p>`;paymentList.innerHTML=data.payments.length?data.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="item"><b>${esc(courseName(p.courseId))} · ${money(p.amount)}</b><small>${p.date} · ${esc(p.method||'未填写方式')}</small><div class="actions"><button class="soft danger" onclick="del('payments','${p.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有缴费记录</div>'}
function renderReport(){if(!reportMonth.value)reportMonth.value=new Date().toISOString().slice(0,7);let ym=reportMonth.value;let a=data.lessons.filter(x=>x.date.startsWith(ym));let count=s=>a.filter(x=>x.status===s).length;reportContent.innerHTML=`<div class="notice">${ym} 课程统计</div><div class="stats"><div class="stat"><span>排课记录</span><b>${a.length}</b></div><div class="stat"><span>已完成</span><b>${count('已完成')}</b></div><div class="stat"><span>请假</span><b>${count('请假')}</b></div></div><p class="meta">待上课：${count('待上课')}　缺课：${count('缺课')}　补课：${count('补课')}<br>本月缴费：${money(data.payments.filter(p=>p.date.startsWith(ym)).reduce((s,p)=>s+p.amount,0))}</p>`}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='宝贝课程管家备份.json';a.click();URL.revokeObjectURL(url)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.courses||!d.lessons||!d.payments)throw 0;if(confirm('导入会覆盖当前数据，确定继续吗？')){data=d;save();alert('恢复成功')}}catch(_){alert('文件格式不正确，无法恢复')}};r.readAsText(f);e.target.value=''}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});\nrender();
</script></body></html>
